name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o bin/api-linux-amd64 ./cmd/api
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o bin/worker-linux-amd64 ./cmd/worker
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o bin/migrate-linux-amd64 ./cmd/migrate
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-w -s" -o bin/api-darwin-amd64 ./cmd/api
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-w -s" -o bin/api-darwin-arm64 ./cmd/api
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-w -s" -o bin/api-windows-amd64.exe ./cmd/api

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            bin/api-linux-amd64
            bin/worker-linux-amd64
            bin/migrate-linux-amd64
            bin/api-darwin-amd64
            bin/api-darwin-arm64
            bin/api-windows-amd64.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
